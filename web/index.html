<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#d3e0cd">
  <title>Cnarrow</title>
  <style>
    :root { color-scheme: light; background: #d3e0cd; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #d3e0cd;
      font-family: system-ui, sans-serif;
      overscroll-behavior: none;
    }
    #game-wrap {
      position: fixed;
      inset: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: grid;
      place-items: stretch;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: .7rem;
      padding: 2rem;
      color: #1d231f;
      text-align: center;
      background: #d3e0cd;
      transition: opacity .25s ease;
    }
    #status.ready { opacity: 0; pointer-events: none; }
    #status.error { color: #562e2e; }
    #status small { max-width: 34rem; color: #6e836f; }
    #build-version {
      position: fixed;
      right: max(6px, env(safe-area-inset-right));
      bottom: max(3px, env(safe-area-inset-bottom));
      z-index: 2;
      color: #6e836f;
      font: 10px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main id="game-wrap"><canvas id="canvas" tabindex="0" aria-label="Cnarrow puzzle game"></canvas></main>
  <div id="status" role="status"><strong>Loading Cnarrow…</strong><small>Preparing the puzzle board</small></div>
  <output id="build-version" aria-label="Build commit">__BUILD_COMMIT__</output>
  <script src="odin.js"></script>
  <script src="cnarrow.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const wrap = document.getElementById('game-wrap');
    const status = document.getElementById('status');
    let game = null;
    let started = false;
    let frameHandle = 0;
    let pixelWidth = 0;
    let pixelHeight = 0;
    let boardZoom = 1;
    let boardPanX = 0;
    let boardPanY = 0;
    let pinch = null;
    let drag = null;

    function canvasPoint(touch) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (touch.clientX - rect.left) * game._cnarrow_screen_width() / rect.width,
        y: (touch.clientY - rect.top) * game._cnarrow_screen_height() / rect.height,
        clientX: touch.clientX,
        clientY: touch.clientY,
      };
    }

    function touchPair(event) {
      if (event.touches.length < 2) return null;
      const a = canvasPoint(event.touches[0]);
      const b = canvasPoint(event.touches[1]);
      return {
        x: (a.x + b.x) / 2,
        y: (a.y + b.y) / 2,
        distance: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
      };
    }

    function setBoardView() {
      game._cnarrow_set_board_view(boardZoom, boardPanX, boardPanY);
      boardPanX = game._cnarrow_board_pan_x();
      boardPanY = game._cnarrow_board_pan_y();
    }

    function consumeTouch(event) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }

    canvas.addEventListener('touchstart', event => {
      if (!started) return;
      consumeTouch(event);
      game._cnarrow_set_input_suppressed(1);
      const pair = touchPair(event);
      if (pair) {
        pinch = { ...pair, zoom: boardZoom, panX: boardPanX, panY: boardPanY };
        drag = null;
        return;
      }
      const point = canvasPoint(event.touches[0]);
      drag = { ...point, panX: boardPanX, panY: boardPanY, moved: false };
    }, { passive: false });

    canvas.addEventListener('touchmove', event => {
      if (!started) return;
      consumeTouch(event);
      const pair = touchPair(event);
      if (pair && pinch) {
        boardZoom = Math.max(1, Math.min(3, pinch.zoom * pair.distance / Math.max(1, pinch.distance)));
        boardPanX = pinch.panX + pair.x - pinch.x;
        boardPanY = pinch.panY + pair.y - pinch.y;
        setBoardView();
        return;
      }
      if (event.touches.length !== 1 || !drag) return;
      const point = canvasPoint(event.touches[0]);
      if (Math.hypot(point.clientX - drag.clientX, point.clientY - drag.clientY) > 8) drag.moved = true;
      if (!drag.moved || boardZoom <= 1) return;
      boardPanX = drag.panX + point.x - drag.x;
      boardPanY = drag.panY + point.y - drag.y;
      setBoardView();
    }, { passive: false });

    function finishTouch(event) {
      if (!started) return;
      consumeTouch(event);
      if (event.touches.length >= 2) return;
      if (pinch) {
        pinch = null;
        if (event.touches.length === 1) {
          const point = canvasPoint(event.touches[0]);
          drag = { ...point, panX: boardPanX, panY: boardPanY, moved: true };
          return;
        }
        drag = null;
        game._cnarrow_set_input_suppressed(0);
        return;
      }
      if (event.touches.length > 0) return;
      if (drag && !drag.moved && event.changedTouches.length > 0) {
        const point = canvasPoint(event.changedTouches[0]);
        game._cnarrow_tap(point.x, point.y);
      }
      drag = null;
      game._cnarrow_set_input_suppressed(0);
    }

    canvas.addEventListener('touchend', finishTouch, { passive: false });
    canvas.addEventListener('touchcancel', finishTouch, { passive: false });

    function canvasPixels() {
      const rect = wrap.getBoundingClientRect();
      const scale = Math.min(window.devicePixelRatio || 1, 2.5);
      return [Math.max(1, Math.round(rect.width * scale)), Math.max(1, Math.round(rect.height * scale))];
    }

    function resize() {
      const [width, height] = canvasPixels();
      if (width === pixelWidth && height === pixelHeight &&
          canvas.width === width && canvas.height === height) return;
      pixelWidth = width;
      pixelHeight = height;
      canvas.width = width;
      canvas.height = height;
      if (started) game._cnarrow_resize(width, height);
    }

    function frame() {
      resize();
      game._cnarrow_frame();
      frameHandle = requestAnimationFrame(frame);
    }

    canvas.addEventListener('contextmenu', event => event.preventDefault());
    new ResizeObserver(resize).observe(wrap);

    createCnarrowModule({
      canvas,
      instantiateWasm(imports, receiveInstance) {
        const wasmMemory = new odin.WasmMemoryInterface();
        wasmMemory.setIntSize(4);
        const odinImports = odin.setupDefaultImports(wasmMemory, null, imports.env?.memory);
        imports.odin_env = odinImports.odin_env;
        imports.env = { ...odinImports.env, ...imports.env };
        return WebAssembly.instantiateStreaming(fetch('cnarrow.wasm'), imports).then(result => {
          const instance = result.instance || result;
          if (instance.exports.memory) wasmMemory.setMemory(instance.exports.memory);
          wasmMemory.setExports(instance.exports);
          receiveInstance(instance, result.module);
          return instance.exports;
        });
      },
    }).then(module => {
      game = module;
      resize();
      game._cnarrow_start(pixelWidth, pixelHeight, Date.now());
      started = true;
      resize();
      status.classList.add('ready');
      canvas.focus({ preventScroll: true });
      frameHandle = requestAnimationFrame(frame);
    }).catch(error => {
      console.error(error);
      status.classList.add('error');
      status.innerHTML = '<strong>Cnarrow could not start.</strong><small>Check WebAssembly/WebGL support and reload the page.</small>';
    });

    addEventListener('pagehide', () => {
      cancelAnimationFrame(frameHandle);
      if (started) game._cnarrow_shutdown();
      started = false;
    }, { once: true });
  </script>
</body>
</html>
